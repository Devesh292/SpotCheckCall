name: slot-watch
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Force a test call"
        type: boolean
        default: false
permissions:
  contents: write
  actions: write
concurrency:
  group: slot-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright (with retries)
        timeout-minutes: 12
        run: |
          pip install playwright
          ok=0
          for i in 1 2 3; do
            if timeout 240 playwright install --with-deps chromium; then ok=1; break; fi
            echo "Attempt $i failed or hung, retrying..."
            sleep 10
          done
          test $ok = 1
      - run: python -u check.py
        env:
          TEST: ${{ github.event.inputs.test }}
          PYTHONUNBUFFERED: "1"
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          MY_NUMBER: ${{ secrets.MY_NUMBER }}
      - name: Save state
        if: always()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json || true
          git diff --cached --quiet || (git commit -m "state" && git push)
      - name: Start next run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watch.yml --ref ${{ github.ref_name }}
